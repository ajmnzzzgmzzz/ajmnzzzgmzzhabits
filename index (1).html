function load() {
  try {
    const r = localStorage.getItem(KEY);
    if (r) { const d = JSON.parse(r); if (d && d.habits) return d; }
    const o = localStorage.getItem(OLD);
    if (o) {
      const d = JSON.parse(o), mon = parse(d.week), log = {};
      d.habits.forEach(h => h.days.forEach((v, i) => { if (v) { const k = fmt(addDays(mon, i)); (log[k] = log[k] || []).push(h.id); } }));
      return { habits: d.habits.map(({ id, name }) => ({ id, name })), log, notes: {}, dark: d.dark !== false };
    }
  } catch (e) {}
  return { habits: DEF, log: {}, notes: {}, dark: false };
}

  const mKeys = Array.from({ length: nDays }, (_, i) => fmt(new Date(am.getFullYear(), am.getMonth(), i + 1)));
  const past = mKeys.filter(k => k <= TODAY);
  const mDone = past.reduce((a, k) => a + dv(k).length, 0);
  const mPct = past.length && habits.length ? mDone / (past.length * habits.length) : 0;

    const t = parse(TODAY), n = habits.length;
    const keys = Object.keys(log).filter(k => dv(k).length).sort();
    const start = keys.length ? parse(keys[0]) : t;
    const days = []; for (let d = start; d <= t; d = addDays(d, 1)) days.push(fmt(d));
    const rate = (a, b) => { let dn = 0, pos = 0; for (let d = a; d <= b && d <= t; d = addDays(d, 1)) { dn += dv(fmt(d)).length; pos += n; } return pos ? dn / pos : 0; };
    const runs = flags => {
      let best = 0, run = 0; flags.forEach(f => { run = f ? run + 1 : 0; best = Math.max(best, run); });
      let cur = 0, i = flags.length - 1; if (i >= 0 && !flags[i]) i--; while (i >= 0 && flags[i]) { cur++; i--; }
      return { cur, best };
    };
    const per = habits.map(h => {
      const flags = days.map(k => has(k, h.id)), total = flags.filter(Boolean).length;
      const l30 = days.slice(-30).filter(k => has(k, h.id)).length / Math.min(30, days.length);
      return { name: h.name, total, rate: total / days.length, l30, ...runs(flags) };
    });
    const perfect = runs(days.map(k => n > 0 && dv(k).length === n));
    const weeks = Array.from({ length: 12 }, (_, i) => { const a = addDays(mondayOf(t), -7 * (11 - i)); return { label: `${a.getDate()}/${a.getMonth() + 1}`, v: rate(a, addDays(a, 6)) }; });
    const wds = Array.from({ length: 7 }, (_, i) => {
      let dn = 0, c = 0;
      for (let d = addDays(t, -83); d <= t; d = addDays(d, 1)) if ((d.getDay() + 6) % 7 === i) { dn += dv(fmt(d)).length; c++; }
      return { label: wd(i), v: c && n ? dn / (c * n) : 0 };
    });
    const months = Array.from({ length: 6 }, (_, i) => {
      const a = new Date(t.getFullYear(), t.getMonth() - (5 - i), 1), b = new Date(a.getFullYear(), a.getMonth() + 1, 0);
      return { label: a.toLocaleDateString(loc, { month: 'short' }), v: rate(a, b) };
    });
    const sl = Object.entries(sleep).filter(([k, v]) => k >= fmt(addDays(t, -29)) && Number(v) > 0).map(([, v]) => Number(v));
    const sorted = [...wds].sort((a, b) => b.v - a.v);
    return {
      per, perfect, weeks, wds, months, w: rate(mondayOf(t), t), m30: rate(addDays(t, -29), t), best: sorted[0], worst: sorted[6],
      sleepAvg: sl.length ? sl.reduce((a, b) => a + b, 0) / sl.length : null,
      sleep14: Array.from({ length: 14 }, (_, i) => { const d = addDays(t, -(13 - i)); const h = Number(sleep[fmt(d)]) || 0; return { label: d.getDate(), v: Math.min(1, h / 12), t: h ? String(+h.toFixed(1)) : '–' }; }),
      goalStats: goals.map(g => {
        const flags = Array.from({ length: 52 }, (_, i) => ((wlog[fmt(addDays(mondayOf(t), -7 * (51 - i)))] || {})[g.id] || 0) >= g.target);
        return { name: g.name, target: g.target, met: flags.slice(-12).filter(Boolean).length, ...runs(flags) };
      }),

            </section>
            <div className="grid gap-6 lg:grid-cols-2">
              <section className={card}>
                <h3 className="mb-1 text-lg font-bold">{tr('byWd')}</h3>
                <p className={`mb-3 text-xs ${muted}`}>{tr('bestL')}: <b className="text-emerald-500">{stats.best.label} ({pc(stats.best.v)})</b> · {tr('worstL')}: <b>{stats.worst.label} ({pc(stats.worst.v)})</b></p>
                <Bars items={stats.wds} h={90} />
              </section>
              <section className={card}>
                <h3 className="mb-1 text-lg font-bold">{tr('monthly')}</h3>
                <p className={`mb-3 text-xs ${muted}`}>{tr('last6')}</p>
                <Bars items={stats.months} h={90} />
              </section>
            </div>
            <section className={`${card} scroll-x`}>
              <h3 className="mb-4 text-lg font-bold">{tr('heat')}</h3>
              {(() => {
                const s0 = addDays(mondayOf(parse(TODAY)), -52 * 7);
                const cols = Array.from({ length: 53 }, (_, c) => addDays(s0, c * 7));
                const cell = p => (p > 0 ? { background: `rgba(16,185,129,${0.25 + p * 0.75})` } : {});
                return (
                  <div className="w-max">
                    <div className="mb-1 grid grid-flow-col gap-[3px]">
                      {cols.map((m, c) => <span key={c} className={`block w-3 overflow-visible whitespace-nowrap text-[10px] ${muted}`}>{(c === 0 ? cols[1].getMonth() === m.getMonth() : m.getMonth() !== cols[c - 1].getMonth()) ? m.toLocaleDateString(loc, { month: 'short' }) : ''}</span>)}
                    </div>
                    <div className="grid grid-flow-col grid-rows-7 gap-[3px]">
                      {cols.flatMap(m => Array.from({ length: 7 }, (_, r) => fmt(addDays(m, r)))).map(k => {
                        const p = dayPct(k);
                        return <span key={k} title={`${k} · ${pc(p)}`} style={cell(p)} className={`h-3 w-3 rounded-[3px] ${p > 0 ? '' : 'bg-slate-200 dark:bg-zinc-800'} ${k > TODAY ? 'opacity-30' : ''}`} />;
                      })}
                    </div>
                    <div className={`mt-3 flex items-center justify-end gap-1.5 text-[10px] ${muted}`}>
                      {tr('heatLess')}
                      {[0, 0.25, 0.5, 0.75, 1].map(p => <span key={p} style={cell(p)} className={`h-3 w-3 rounded-[3px] ${p ? '' : 'bg-slate-200 dark:bg-zinc-800'}`} />)}
                      {tr('heatMore')}
                    </div>
                  </div>
                );
              })()}
            </section>
            {stats.sleepAvg != null && (
              <section className={card}>
                <h3 className="mb-1 text-lg font-bold">{tr('slTitle')}</h3>
                <p className={`mb-3 text-xs ${muted}`}>{tr('hrs')}</p>
                <Bars items={stats.sleep14} h={90} />
              </section>
            )}
            {stats.goalStats.length > 0 && (
              <section className={`${card} scroll-x`}>
                <h3 className="mb-3 text-lg font-bold">{tr('goals')}</h3>
                <table className="w-full min-w-[480px] text-left text-sm">
                  <thead className={`text-xs ${muted}`}><tr><th className="pb-2 font-normal">{tr('habit')}</th><th className="pb-2 text-right font-normal">{tr('gwk')}</th><th className="pb-2 text-right font-normal">{tr('cStreak')}</th><th className="pb-2 text-right font-normal">{tr('best')}</th></tr></thead>
                  <tbody>
                    {stats.goalStats.map(g => (
                      <tr key={g.name} className="border-t border-slate-200 dark:border-zinc-800">
                        <td className="py-2 pr-2">{g.name} <span className={`text-xs ${muted}`}>({tr('perWeek', { n: g.target })})</span></td>
                        <td className="text-right tabular-nums">{g.met}/12</td>
                        <td className="text-right tabular-nums text-emerald-500">{g.cur}</td>
                        <td className="text-right tabular-nums">{g.best}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                <p className={`mt-3 text-xs ${muted}`}>{tr('gNote')}</p>
              </section>
            )}
            <section className={`${card} scroll-x`}>
              <h3 className="mb-3 text-lg font-bold">{tr('perHab')}</h3>
              <table className="w-full min-w-[520px] text-left text-sm">
                <thead className={`text-xs ${muted}`}><tr><th className="pb-2 font-normal">{tr('habit')}</th>{['cTotal', 'cGlob', 'c30', 'cStreak', 'best'].map(c => <th key={c} className="pb-2 text-right font-normal">{tr(c)}</th>)}</tr></thead>
                <tbody>
                  {stats.per.map(p => (
                    <tr key={p.name} className="border-t border-slate-200 dark:border-zinc-800">
                      <td className="py-2 pr-2">{p.name}</td>
                      <td className="text-right tabular-nums">{p.total}</td><td className="text-right tabular-nums">{pc(p.rate)}</td><td className="text-right tabular-nums">{pc(p.l30)}</td>
                      <td className="text-right tabular-nums text-emerald-500">{p.cur} {tr('dS')}</td><td className="text-right tabular-nums">{p.best} {tr('dS')}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
              <p className={`mt-3 text-xs ${muted}`}>{tr('foot', { c: stats.checkins, n: stats.nNotes })}</p>
            </section>
            <section className={card}>
              <h3 className="mb-1 text-lg font-bold">{tr('backup')}</h3>
              <p className={`mb-4 text-sm ${muted}`}>{tr('backupD')}</p>
              <div className="flex flex-wrap items-center gap-2">
                <button onClick={doExport} className={okBtn}>{tr('exp')}</button>
                <label className={`${btn} cursor-pointer !py-2 !text-sm`}>{tr('imp')}<input type="file" accept=".json,application/json" onChange={onFile} className="hidden" /></label>
              </div>
              {impData && (
                <div className="mt-4 flex flex-wrap items-center gap-2">
                  <span className="text-sm">{tr('impAsk')}</span>
                  <button onClick={applyImport} className="rounded-xl bg-red-500 px-3 py-1.5 text-xs font-medium text-white">{tr('yesRep')}</button>
                  <button onClick={() => setImpData(null)} className={btn}>{tr('cancel')}</button>
                </div>
              )}
              {msg && <p className={`mt-3 text-sm ${msg === 'ok' ? 'text-emerald-500' : 'text-red-500'}`}>{tr(msg === 'ok' ? 'impOk' : 'impErr')}</p>}
              {bk !== null && (
                <div className="mt-4">
                  <p className={`mb-2 text-xs ${muted}`}>{tr('bkNote')}</p>
                  <textarea value={bk} onChange={e => setBk(e.target.value)} rows={6} className={`${inp} w-full font-mono text-xs`} />
                  <button onClick={() => readImport(bk)} className={`${btn} mt-2`}>{tr('impTxt')}</button>
                </div>
              )}
            </section>
          </div>
        )}

        <p className="mt-8 text-center text-xs text-slate-400 dark:text-zinc-600">{tr('local')}</p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
